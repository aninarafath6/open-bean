<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<meta name="theme-color" content="#EFF0F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0C0E1A" media="(prefers-color-scheme: dark)">
<title>{% block title %}open-bean{% endblock %}</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='88'%3E%F0%9F%AB%98%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script>
// Runs before first paint so a saved theme never flashes the other one.
(function () {
  try {
    var saved = localStorage.getItem('ob-theme');
    if (saved === 'light' || saved === 'dark') document.documentElement.setAttribute('data-theme', saved);
  } catch (e) {}
})();
</script>
<style>
  /* Navy ink on cool grey, white cards, tiny tracked capitals for labels.
     Green only for money in / up; red only for money you're short. */
  :root {
    color-scheme: light;
    --bg:#EFF0F4; --card:#FFFFFF; --ink:#1E2454; --on-ink:#FFFFFF;
    --fg:#1E2454; --fg-2:#6A7091; --fg-3:#A2A6BF;
    --line:#E8EAF1; --fill:#F2F3F8;
    --pos:#1C9E5C; --neg:#E0484F;
    --shadow: 0 1px 2px rgba(30,36,84,.05), 0 8px 24px -14px rgba(30,36,84,.22);
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      color-scheme: dark;
      --bg:#0C0E1A; --card:#151829; --ink:#E4E6F5; --on-ink:#151829;
      --fg:#E4E6F5; --fg-2:#8C92B2; --fg-3:#5B6182;
      --line:#23273D; --fill:#1C2035;
      --pos:#3FCB82; --neg:#FF6B6B;
      --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -16px rgba(0,0,0,.8);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg:#0C0E1A; --card:#151829; --ink:#E4E6F5; --on-ink:#151829;
    --fg:#E4E6F5; --fg-2:#8C92B2; --fg-3:#5B6182;
    --line:#23273D; --fill:#1C2035;
    --pos:#3FCB82; --neg:#FF6B6B;
    --shadow: 0 1px 2px rgba(0,0,0,.35), 0 10px 28px -16px rgba(0,0,0,.8);
  }

  * { box-sizing:border-box; }
  html { -webkit-text-size-adjust:100%; }
  body {
    margin:0; background:var(--bg); color:var(--fg);
    font: 400 15px/1.5 "Plus Jakarta Sans", -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, system-ui, sans-serif;
    font-variant-numeric: tabular-nums;
    -webkit-font-smoothing:antialiased;
  }
  a { color:inherit; text-decoration:none; }
  .pos { color:var(--pos); } .neg { color:var(--neg); } .muted { color:var(--fg-2); }

  @view-transition { navigation: auto; }
  ::view-transition-old(root) { animation: out .15s ease both; }
  ::view-transition-new(root) { animation: in .28s ease both; }
  @keyframes out { to { opacity:0; } }
  @keyframes in { from { opacity:0; transform: translateY(4px); } }

  .page { max-width: 1080px; margin:0 auto; padding: 22px 20px 120px; }
  .page.narrow { max-width: 680px; }

  /* ---------- Header ---------- */
  .top { display:flex; align-items:center; gap:12px; margin-bottom: 28px; }
  .logo { display:flex; align-items:center; gap:9px; font-weight:700; font-size:17px; color:var(--fg-2); letter-spacing:-.01em; margin-right:auto; }
  .logo .mark { width:26px; height:26px; border-radius:50%; background:var(--ink); display:grid; place-items:center; color:var(--on-ink); font-size:13px; }
  .nav { display:flex; gap:8px; }
  .chip, .nav a {
    display:inline-flex; align-items:center; gap:7px; height:34px; padding: 0 12px;
    border-radius:8px; background:var(--card); border:1px solid var(--line);
    font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--fg);
    transition: background-color .15s ease, color .15s ease, border-color .15s ease;
  }
  .nav a svg { width:15px; height:15px; }
  .nav a:hover { border-color: var(--fg-3); }
  .nav a.on { background:var(--ink); border-color:var(--ink); color:var(--on-ink); }
  .icon-btn {
    width:36px; height:36px; flex:none; display:grid; place-items:center; border-radius:50%;
    background:var(--card); border:1px solid var(--line); color:var(--fg); cursor:pointer;
  }
  .icon-btn:hover { border-color: var(--fg-3); }
  .icon-btn svg { width:17px; height:17px; }
  .icon-btn[aria-disabled="true"] { opacity:.35; pointer-events:none; }
  [data-theme-toggle] .sun { display:none; }
  [data-theme-toggle][data-mode="dark"] .sun { display:block; }
  [data-theme-toggle][data-mode="dark"] .moon { display:none; }

  /* ---------- Type ---------- */
  .eyebrow { font-size:11.5px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--fg-2); margin:0; }
  .eyebrow.dark { color:var(--fg); }
  .eyebrow .ic { display:inline-grid; place-items:center; width:18px; height:18px; border-radius:50%; background:var(--ink); color:var(--on-ink); font-size:10px; margin-right:6px; vertical-align:-4px; letter-spacing:0; }
  .big { font-size:42px; font-weight:700; letter-spacing:-.025em; line-height:1.1; margin: 10px 0 0; }
  .cur { font-size:.5em; font-weight:600; vertical-align:.8em; margin-right:.1em; }
  .minus { color:var(--fg-3); font-weight:500; margin-right:.2em; }
  .code { font-size:.5em; font-weight:600; color:var(--fg-2); margin-left:.25em; }
  .note { font-size:13.5px; color:var(--fg-2); margin: 6px 0 0; }
  .up { color:var(--pos); font-weight:600; }
  .down { color:var(--neg); font-weight:600; }

  /* ---------- Cards ---------- */
  .card { background:var(--card); border-radius:16px; box-shadow:var(--shadow); }
  .card-pad { padding: 20px; }
  .card-head { display:flex; align-items:center; justify-content:space-between; gap:12px; padding: 16px 20px; border-bottom:1px solid var(--line); }
  .stack { display:grid; gap:16px; align-content:start; }
  .greet { margin-bottom: 20px; }
  .greet .eyebrow + .eyebrow { margin-top:4px; }

  .home { display:grid; gap:16px; }
  @media (min-width: 900px) { .home { grid-template-columns: 1fr 1fr; gap:20px; align-items:start; } .home .stack { gap:20px; } }

  /* Stepper */
  .stepper { display:flex; align-items:center; gap:6px; }
  .stepper .m { font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; min-width:96px; text-align:center; }

  /* Meter + daily strip */
  .meter { height:6px; background:var(--fill); border-radius:3px; margin-top:20px; overflow:hidden; }
  .meter span { display:block; height:100%; background:var(--ink); border-radius:inherit; transform-origin:left; animation: grow .8s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes grow { from { transform:scaleX(0); } }
  .legend { display:flex; justify-content:space-between; font-size:12px; color:var(--fg-2); margin-top:8px; }
  .days { display:flex; align-items:flex-end; gap:3px; height:64px; margin-top:24px; }
  .days i { flex:1; background:var(--fill); border-radius:2px; min-height:3px; }
  .days i.any { background:var(--ink); transform-origin:bottom; animation: rise .6s cubic-bezier(.2,.8,.2,1) both; }
  @keyframes rise { from { transform:scaleY(0); } }
  .axis { display:flex; justify-content:space-between; font-size:11px; font-weight:600; letter-spacing:.06em; text-transform:uppercase; color:var(--fg-3); margin-top:8px; }

  /* Net worth card */
  .nw { display:flex; align-items:flex-end; gap:16px; }
  .nw .l { flex:1; min-width:0; }
  .nw .spark { width: 44%; height: 64px; }
  .nw .spark svg { width:100%; height:100%; }

  /* Rows */
  .row { display:flex; align-items:center; justify-content:space-between; gap:14px; padding: 14px 20px; }
  .row + .row { border-top:1px solid var(--line); }
  a.row:hover { background: var(--fill); }
  .row .l { display:flex; align-items:center; gap:12px; min-width:0; flex:1; }
  .row .name { font-size:14.5px; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .row .meta { font-size:12.5px; color:var(--fg-2); }
  .row .r { text-align:right; white-space:nowrap; font-size:14.5px; font-weight:600; }
  .row .r .meta { font-weight:500; }
  .row.total { background: var(--fill); border-radius: 0 0 16px 16px; }
  .mark-i { width:34px; height:34px; border-radius:50%; flex:none; display:grid; place-items:center; font-size:13px; font-weight:700; background:var(--fill); color:var(--fg); }

  .cat { display:block; padding: 14px 20px; }
  .cat + .cat { border-top:1px solid var(--line); }
  .cat .top-line { display:flex; justify-content:space-between; gap:12px; font-size:14.5px; font-weight:600; }
  .cat .top-line .pct { font-size:12.5px; color:var(--fg-2); font-weight:500; margin-left:8px; }
  .bar { height:4px; background:var(--fill); border-radius:2px; margin-top:10px; overflow:hidden; }
  .bar span { display:block; height:100%; background:var(--ink); border-radius:inherit; transform-origin:left; animation: grow .8s cubic-bezier(.2,.8,.2,1) .1s both; }

  /* Transaction cards */
  .txns { display:grid; gap:10px; }
  .txn { padding:0; }
  .txn .t1 { display:flex; justify-content:space-between; gap:12px; padding: 12px 18px; border-bottom:1px solid var(--line); font-size:14px; color:var(--fg-2); font-weight:500; }
  .txn .t1 .who { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .txn .t1 .when { flex:none; }
  .txn .t2 { display:flex; justify-content:space-between; align-items:center; gap:12px; padding: 12px 18px 14px; }
  .txn .amt { font-size:25px; font-weight:500; letter-spacing:-.02em; white-space:nowrap; }
  .txn .amt.pos { color:var(--pos); }
  .txn .amt.muted { color:var(--fg-2); }
  .pill { font-size:11px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--fg); background:var(--fill); border-radius:8px; padding: 7px 11px; white-space:nowrap; max-width:55%; overflow:hidden; text-overflow:ellipsis; }

  .more { display:block; text-align:center; padding: 12px; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; color:var(--fg-2); }
  .more:hover { color:var(--fg); }
  .empty { padding: 22px 20px; color:var(--fg-2); font-size:14px; }
  .section { margin: 28px 4px 10px; }

  /* Forms */
  form.range { display:flex; flex-wrap:wrap; align-items:center; gap:10px; margin: 16px 0 0; }
  form.range label { display:flex; align-items:center; gap:8px; }
  input[type=date] { font:inherit; font-size:14px; font-weight:500; color:var(--fg); background:var(--card); border:1px solid var(--line); border-radius:8px; padding:7px 10px; }
  input[type=date]:focus { outline:none; border-color:var(--fg-2); }
  .btn { height:34px; padding:0 14px; border:none; border-radius:8px; background:var(--ink); color:var(--on-ink); font:inherit; font-size:11.5px; font-weight:700; letter-spacing:.07em; text-transform:uppercase; cursor:pointer; }
  .btn:active { opacity:.85; }

  .errors { white-space:pre-wrap; font:12.5px/1.5 ui-monospace, Menlo, monospace; color:var(--neg); background:var(--card); border-radius:12px; padding:14px 16px; margin-bottom:20px; box-shadow:var(--shadow); }

  /* Chart */
  .chart { width:100%; height:auto; overflow:visible; }
  .chart-line { stroke-width:2.25px; stroke-linejoin:round; stroke-linecap:round; stroke-dasharray:2000; stroke-dashoffset:2000; animation: draw 1.3s ease-out forwards; }
  .chart-area { opacity:0; animation: fade .8s ease .5s forwards; }
  @keyframes draw { to { stroke-dashoffset:0; } }
  @keyframes fade { to { opacity:1; } }
  .chart-zero { stroke: var(--line); stroke-dasharray:3 4; }
  .chart-point { fill: var(--card); stroke-width:2px; opacity:0; r:3; }
  .chart-point-group:hover .chart-point { opacity:1; r:5; }
  .chart-point-hit { cursor:pointer; }
  .chart-label { fill: var(--fg-3); font-size:11px; font-weight:600; }

  /* Phone tab bar */
  .tabs { display:none; }
  @media (max-width: 759px) {
    .nav { display:none; }
    .tabs {
      display:flex; position:fixed; left:0; right:0; bottom:0; z-index:10;
      background:var(--card); border-top:1px solid var(--line);
      padding: 8px 8px calc(8px + env(safe-area-inset-bottom));
    }
    .tabs a { flex:1; display:flex; flex-direction:column; align-items:center; gap:4px; font-size:11px; font-weight:600; color:var(--fg-3); padding:4px 0; }
    .tabs a svg { width:22px; height:22px; }
    .tabs a.on { color:var(--fg); }
    .big { font-size:38px; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation:none !important; transition:none !important; }
    .chart-line { stroke-dashoffset:0; } .chart-area { opacity:1; }
    @view-transition { navigation: none; }
  }
</style>
</head>
<body>
<div class="page {% block page_class %}{% endblock %}">
  <header class="top">
    <a class="logo" href="/"><span class="mark"><svg width="15" height="15" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M16.2 3.6c3.3 1.9 3.9 7.1 1.1 11.5s-7.9 6.4-11 4.6-3.3-6.8-.5-11.2S12.9 1.7 16.2 3.6Z"/><path d="M8.6 16.6c1.6-1.1 2.8-2.9 3.3-4.9s1.5-3.5 3.3-4.4" fill="none" stroke="var(--ink)" stroke-width="1.7" stroke-linecap="round"/></svg></span>open-bean</a>
    <nav class="nav" aria-label="Primary">
      <a href="/" class="{% if nav == "home" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></svg>Home</a>
      <a href="/reports/income-statement" class="{% if nav == "income" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg>Spending</a>
      <a href="/accounts" class="{% if nav == "accounts" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Accounts</a>
      <a href="/reports/net-worth" class="{% if nav == "trends" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Net worth</a>
    </nav>
    <button class="icon-btn" type="button" data-theme-toggle aria-label="Toggle dark mode">
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8.5 8.5 0 1 1 9.5 4a6.8 6.8 0 0 0 10.5 10.5Z"/></svg>
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.2M12 19.3v2.2M21.5 12h-2.2M4.7 12H2.5M18.7 5.3l-1.6 1.6M6.9 17.1l-1.6 1.6M18.7 18.7l-1.6-1.6M6.9 6.9 5.3 5.3"/></svg>
    </button>
  </header>

  {% if !errors.is_empty() %}
  <div class="errors">{% for e in errors %}{{ e }}
{% endfor %}</div>
  {% endif %}

  {% block content %}{% endblock %}
</div>

<nav class="tabs" aria-label="Primary">
  <a href="/" class="{% if nav == "home" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="{% if nav == "home" %}currentColor{% else %}none{% endif %}" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 10.5 12 4l8 6.5V19a1 1 0 0 1-1 1h-4.5v-5.5h-5V20H5a1 1 0 0 1-1-1Z"/></svg>Home</a>
  <a href="/reports/income-statement" class="{% if nav == "income" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M6 3h12v18l-3-2-3 2-3-2-3 2Z"/><path d="M9 8h6M9 12h6"/></svg>Spending</a>
  <a href="/accounts" class="{% if nav == "accounts" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 9.5 12 4l9 5.5M5 10v8M9.5 10v8M14.5 10v8M19 10v8M3 20h18"/></svg>Accounts</a>
  <a href="/reports/net-worth" class="{% if nav == "trends" %}on{% endif %}"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 17l6-6 4 4 8-8"/><path d="M15 7h6v6"/></svg>Net worth</a>
</nav>

<script>
(function () {
  var root = document.documentElement;
  var btn = document.querySelector('[data-theme-toggle]');
  var media = window.matchMedia('(prefers-color-scheme: dark)');
  function effective() { return root.getAttribute('data-theme') || (media.matches ? 'dark' : 'light'); }
  function reflect() { btn.setAttribute('data-mode', effective()); }
  btn.addEventListener('click', function () {
    var next = effective() === 'dark' ? 'light' : 'dark';
    root.setAttribute('data-theme', next);
    try { localStorage.setItem('ob-theme', next); } catch (e) {}
    reflect();
  });
  if (media.addEventListener) media.addEventListener('change', reflect);
  reflect();
})();
</script>
</body>
</html>
